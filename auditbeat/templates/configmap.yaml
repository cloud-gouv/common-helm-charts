        -w /hostfs/usr/sbin/ncat -p x -k susp_activity_exec
        -w /hostfs/usr/local/sbin/ncat -p x -k susp_activity_exec
        -w /hostfs/usr/local/bin/ncat -p x -k susp_activity_exec
        -w /hostfs/usr/bin/ss -p x -k susp_activity_exec
        -w /hostfs/bin/ss -p x -k susp_activity_exec
        -w /hostfs/usr/sbin/ss -p x -k susp_activity_exec
        -w /hostfs/usr/local/sbin/ss -p x -k susp_activity_exec
        -w /hostfs/usr/local/bin/ss -p x -k susp_activity_exec
        -w /hostfs/usr/bin/netstat -p x -k susp_activity_exec
        -w /hostfs/bin/netstat -p x -k susp_activity_exec
        -w /hostfs/usr/sbin/netstat -p x -k susp_activity_exec
        -w /hostfs/usr/local/sbin/netstat -p x -k susp_activity_exec
        -w /hostfs/usr/local/bin/netstat -p x -k susp_activity_exec
        -w /hostfs/usr/bin/ssh -p x -k susp_activity_exec
        -w /hostfs/bin/ssh -p x -k susp_activity_exec
        -w /hostfs/usr/sbin/ssh -p x -k susp_activity_exec
