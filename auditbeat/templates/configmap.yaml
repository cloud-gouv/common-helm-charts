apiVersion: v1
kind: ConfigMap
metadata:
  name: auditbeat-config
  namespace: {{ .Release.Namespace }}
  labels:
    k8s-app: auditbeat
data:
  auditbeat.yml: |-
    auditbeat.config.modules:
      # Mounted `auditbeat-daemonset-modules` configmap:
      path: ${path.config}/modules.d/*.yml
      reload.enabled: false

    processors:
      - add_host_metadata:
      - add_cloud_metadata:
      - add_process_metadata:
          match_pids: ['process.ppid']
          include_fields: ['container.id']
          target: process.parent
      - add_kubernetes_metadata:
          host: ${NODE_NAME}
          default_indexers.enabled: false
          default_matchers.enabled: false
          indexers:
            - container:
          matchers:
            - fields.lookup_fields: ['container.id']
      - drop_fields:
          fields: ["agent", "host.mac", "host.os", "host.geo"]
    output.console:
      enabled: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auditbeat-daemonset-modules
  namespace: {{ .Release.Namespace }}
  labels:
    k8s-app: auditbeat
data:
  system.yml: |-
    - module: file_integrity
      paths:
      - /hostfs/etc
      - /hostfs/boot
      - /hostfs/opt
      - /hostfs/root
      scan_at_start: true
      scan_rate_per_sec: 10 MiB
      max_file_size: 500 MiB
      hash_types: [sha512]
      recursive: true
    - module: auditd
      audit_rules: |
        ####################Configuration auditd (mode intégré à auditbeat) ###########
        #                                   SECTIONS :                                #
        # Self Auditing --------------------------------------------------------------#
        # Filters --------------------------------------------------------------------#
        # Rules ----------------------------------------------------------------------#
        # Special Rules --------------------------------------------------------------#
        # Software Management --------------------------------------------------------#
        # Special Software -----------------------------------------------------------#
        # High Volume Events ---------------------------------------------------------#
        # CSIRT specific others binaries exec ----------------------------------------#
        # Make The Configuration Immutable -------------------------------------------#
        ################################# CSIRT-DINUM #################################

        # Self Auditing ---------------------------------------------------------------
        ## Auditd configuration
        ### Modifications to audit configuration that occur while the audit collection functions are operating
        -w /etc/auditbeat/auditbeat.yml -p wa -k auditconfig
        -w /etc/auditbeat/audit.rules.d/ -p wa -k auditconfig
        # Filters ---------------------------------------------------------------------
        ### We put these early because audit is a first match wins system.
        ## Ignore current working directory records
        ## -a always,exclude -F msgtype=CWD
        ## Cron jobs fill the logs with stuff we normally don't want (works with SELinux)
        -a never,user -F subj_type=crond_t
        -a never,exit -F subj_type=crond_t
        ## This prevents chrony from overwhelming the logs
        #-a never,exit -F arch=b64 -S adjtimex -F auid=-1 -F uid=chrony -F subj_type=chronyd_t
        ## This is not very interesting and wastes a lot of space if the server is public facing
        -a always,exclude -F msgtype=CRYPTO_KEY_USER
        ## Open VM Tools
        -a exit,never -F arch=b64 -S all -F exe=/hostfs/usr/bin/vmtoolsd
        ## High Volume Event Filter (especially on Linux Workstations)
        -a never,exit -F arch=b64 -F dir=/hostfs/dev/shm/ -F key=sharedmemaccess
        -a never,exit -F arch=b64 -F dir=/hostfs/var/lock/lvm/ -F key=locklvm
        ## More information on how to filter events
        ### <https://access.redhat.com/solutions/2482221>
        # Rules -----------------------------------------------------------------------
        ## Syslog config change
        -a always,exit -F dir=/hostfs/etc/rsyslog/ -F perm=wa -k syslog_config
        -a always,exit -F dir=/hostfs/etc/syslog-ng/ -F perm=wa -k syslog_config
        ## Kernel parameters
        -w /hostfs/etc/sysctl.conf -p wa -k sysctl
        -w /hostfs/etc/sysctl.d -p wa -k sysctl
        ## Kernel module loading and unloading
        -a always,exit -F perm=x -F auid!=-1 -F path=/hostfs/sbin/insmod -k modules
        -a always,exit -F perm=x -F auid!=-1 -F path=/hostfs/sbin/modprobe -k modules
        -a always,exit -F perm=x -F auid!=-1 -F path=/hostfs/sbin/rmmod -k modules
        -a always,exit -F arch=b64 -S finit_module -S init_module -S delete_module -F auid!=-1 -k modules
        ## Modprobe configuration
        -w /hostfs/etc/modprobe.conf -p wa -k modprobe
        -w /hostfs/etc/modprobe.d -p wa -k modprobe
        -a always,exit -F dir=/etc/modprobe.d -F perm=wa -k modprobe_dir_changes
        ## KExec usage (all actions)
        -a always,exit -F arch=b64 -S kexec_load -k KEXEC
        ## Special files
        -a always,exit -F arch=b64 -S mknod -S mknodat -k specialfiles
        ## Mount operations (only attributable)
        -a always,exit -F arch=b64 -S mount -S umount2 -F auid!=-1 -k mount
        ### NFS mount
        -a always,exit -F path=/hostfs/sbin/mount.nfs -F perm=x -F auid>=500 -F auid!=4294967295 -k T1078_Valid_Accounts
        -a always,exit -F path=/hostfs/usr/sbin/mount.nfs -F perm=x -F auid>=500 -F auid!=4294967295 -k T1078_Valid_Accounts
        ## Change swap (only attributable)
        -a always,exit -F arch=b64 -S swapon -S swapoff -F auid!=-1 -k swap
        ## Time
        #-a always,exit -F arch=b64 -F uid!=ntp -S adjtimex -S settimeofday -S clock_settime -k time
        ### Local time zone
        -w /hostfs/etc/localtime -p wa -k localtime
        ## Stunnel
        -w /hostfs/usr/bin/stunnel -p x -k stunnel_exec
        -w /hostfs/bin/stunnel -p x -k stunnel_exec
        -w /hostfs/usr/sbin/stunnel -p x -k stunnel_exec
        -w /hostfs/usr/local/sbin/stunnel -p x -k stunnel_exec
        -w /hostfs/usr/local/bin/stunnel -p x -k stunnel_exec
        ## Cron configuration & scheduled jobs
        -w /hostfs/etc/cron.allow -p wa -k cron
        -w /hostfs/etc/cron.deny -p wa -k cron
        -w /hostfs/etc/cron.d/ -p wa -k cron
        -w /hostfs/etc/cron.daily/ -p wa -k cron
        -w /hostfs/etc/cron.hourly/ -p wa -k cron
        -w /hostfs/etc/cron.monthly/ -p wa -k cron
        -w /hostfs/etc/cron.weekly/ -p wa -k cron
        -w /hostfs/etc/crontab -p wa -k cron
        -w /hostfs/var/spool/cron/ -p wa -k cron
        ## User, group, password databases
        -w /hostfs/etc/group -p wa -k etcgroup
        -w /hostfs/etc/passwd -p wa -k etcpasswd
        -w /hostfs/etc/gshadow -k etcgroup
        -w /hostfs/etc/shadow -k etcpasswd
        -w /hostfs/etc/security/opasswd -k opasswd
        ## Sudoers file changes
        -w /hostfs/etc/sudoers -p wa -k actions
        -w /hostfs/etc/sudoers.d/ -p wa -k actions
        ## Passwd
        -w /hostfs/usr/bin/passwd -p x -k passwd_modification_exec
        -w /hostfs/bin/passwd -p x -k passwd_modification_exec
        -w /hostfs/usr/sbin/passwd -p x -k passwd_modification_exec
        -w /hostfs/usr/local/sbin/passwd -p x -k passwd_modification_exec
        -w /hostfs/usr/local/bin/passwd -p x -k passwd_modification_exec
        ## Tools to change group identifiers
        -w /hostfs/usr/bin/groupadd -p x -k group_modification_exec
        -w /hostfs/bin/groupadd -p x -k group_modification_exec
        -w /hostfs/usr/sbin/groupadd -p x -k group_modification_exec
        -w /hostfs/usr/local/sbin/groupadd -p x -k group_modification_exec
        -w /hostfs/usr/local/bin/groupadd -p x -k group_modification_exec
        -w /hostfs/usr/bin/groupmod -p x -k group_modification_exec
        -w /hostfs/bin/groupmod -p x -k group_modification_exec
        -w /hostfs/usr/sbin/groupmod -p x -k group_modification_exec
        -w /hostfs/usr/local/sbin/groupmod -p x -k group_modification_exec
        -w /hostfs/usr/local/bin/groupmod -p x -k group_modification_exec
        -w /hostfs/usr/bin/addgroup -p x -k group_modification_exec
        -w /hostfs/bin/addgroup -p x -k group_modification_exec
        -w /hostfs/usr/sbin/addgroup -p x -k group_modification_exec
        -w /hostfs/usr/local/sbin/addgroup -p x -k group_modification_exec
        -w /hostfs/usr/local/bin/addgroup -p x -k group_modification_exec
        -w /hostfs/usr/bin/useradd -p x -k user_modification_exec
        -w /hostfs/bin/useradd -p x -k user_modification_exec
        -w /hostfs/usr/sbin/useradd -p x -k user_modification_exec
        -w /hostfs/usr/local/sbin/useradd -p x -k user_modification_exec
        -w /hostfs/usr/local/bin/useradd -p x -k user_modification_exec
        -w /hostfs/usr/bin/userdel -p x -k user_modification_exec
        -w /hostfs/bin/userdel -p x -k user_modification_exec
        -w /hostfs/usr/sbin/userdel -p x -k user_modification_exec
        -w /hostfs/usr/local/sbin/userdel -p x -k user_modification_exec
        -w /hostfs/usr/local/bin/userdel -p x -k user_modification_exec
        -w /hostfs/usr/bin/usermod -p x -k user_modification_exec
        -w /hostfs/bin/usermod -p x -k user_modification_exec
        -w /hostfs/usr/sbin/usermod -p x -k user_modification_exec
        -w /hostfs/usr/local/sbin/usermod -p x -k user_modification_exec
        -w /hostfs/usr/local/bin/usermod -p x -k user_modification_exec
        -w /hostfs/usr/bin/adduser -p x -k user_modification_exec
        -w /hostfs/bin/adduser -p x -k user_modification_exec
        -w /hostfs/usr/sbin/adduser -p x -k user_modification_exec
        -w /hostfs/usr/local/sbin/adduser -p x -k user_modification_exec
        -w /hostfs/usr/local/bin/adduser -p x -k user_modification_exec
        ## Login configuration and information
        -w /hostfs/etc/login.defs -p wa -k login
        -w /hostfs/etc/securetty -p wa -k login
        -w /hostfs/var/log/faillog -p wa -k login
        -w /hostfs/var/log/lastlog -p wa -k login
        -w /hostfs/var/log/tallylog -p wa -k login
        ## Network Environment
        ### Changes to hostname
        -a always,exit -F arch=b64 -S sethostname -S setdomainname -k network_modifications
        ### Detect Remote Shell Use
        -a always,exit -F arch=b64 -F exe=/hostfs/bin/bash -F success=1 -S connect -k remote_shell
        -a always,exit -F arch=b64 -F exe=/hostfs/usr/bin/bash -F success=1 -S connect -k remote_shell
        ### Changes to other files
        -w /hostfs/etc/hosts -p wa -k network_modifications
        -w /hostfs/etc/sysconfig/network -p wa -k network_modifications
        -w /hostfs/etc/sysconfig/network-scripts -p w -k network_modifications
        -w /hostfs/etc/network/ -p wa -k network
        -a always,exit -F dir=/hostfs/etc/NetworkManager/ -F perm=wa -k network_modifications
        ### Changes to issue
        -w /hostfs/etc/issue -p wa -k etcissue
        -w /hostfs/etc/issue.net -p wa -k etcissue
        ## System startup scripts
        -w /hostfs/etc/inittab -p wa -k init
        -w /hostfs/etc/init.d/ -p wa -k init
        -w /hostfs/etc/init/ -p wa -k init
        -w /hostfs/etc/rc.d/ -p wa -k init
        -w /hostfs/etc/rc.local -p wa -k init
        -w /hostfs/etc/rc.common -p wa -k init
        ## Library search paths
        -w /hostfs/etc/ld.so.conf -p wa -k libpath
        -w /hostfs/etc/ld.so.conf.d -p wa -k libpath
        ## Systemwide library preloads (LD_PRELOAD)
        -w /hostfs/etc/ld.so.preload -p wa -k systemwide_preloads
        ## Pam configuration
        -w /hostfs/etc/pam.d/ -p wa -k pam
        -w /hostfs/etc/security/limits.conf -p wa  -k pam
        -w /hostfs/etc/security/limits.d -p wa  -k pam
        -w /hostfs/etc/security/pam_env.conf -p wa -k pam
        -w /hostfs/etc/security/namespace.conf -p wa -k pam
        -w /hostfs/etc/security/namespace.d -p wa -k pam
        -w /hostfs/etc/security/namespace.init -p wa -k pam
        ## Mail configuration
        -w /hostfs/etc/aliases -p wa -k mail
        -w /hostfs/etc/postfix/ -p wa -k mail
        -w /hostfs/etc/exim4/ -p wa -k mail
        ## SSH configuration
        -w /hostfs/etc/ssh/sshd_config -k sshd
        -w /hostfs/etc/ssh/sshd_config.d -k sshd
        ## root ssh key tampering
        -w /hostfs/root/.ssh -p wa -k rootkey
        # Systemd
        -w /hostfs/usr/bin/systemctl -p x -k systemctl_command_exec
        -w /hostfs/bin/systemctl -p x -k systemctl_command_exec
        -w /hostfs/usr/sbin/systemctl -p x -k systemctl_command_exec
        -w /hostfs/usr/local/sbin/systemctl -p x -k systemctl_command_exec
        -w /hostfs/usr/local/bin/systemctl -p x -k systemctl_command_exec
        -w /hostfs/etc/systemd/ -p wa -k systemd
        -w /hostfs/run/systemd/ -p wa -k systemd
        -w /hostfs/usr/lib/systemd -p wa -k systemd
        ## <https://systemd.network/systemd.generator.html>
        -w /hostfs/etc/systemd/system-generators/ -p wa -k systemd_generator
        -w /hostfs/usr/local/lib/systemd/system-generators/ -p wa -k systemd_generator
        -w /hostfs/usr/lib/systemd/system-generators -p wa -k systemd_generator
        -w /hostfs/etc/systemd/user-generators/ -p wa -k systemd_generator
        -w /hostfs/usr/local/lib/systemd/user-generators/ -p wa -k systemd_generator
        -w /hostfs/lib/systemd/system-generators/ -p wa -k systemd_generator
        ## SELinux events that modify the system's Mandatory Access Controls (MAC)
        -w /hostfs/etc/selinux/ -p wa -k selinux_config_delete_or_edit
        -w /hostfs/etc/sysconfig/selinux -p wa -k selinux_config_delete_or_edit 
        -w /hostfs/selinux/enforce -p wa -k selinux_config_delete_or_edit 
        -w /hostfs/etc/selinux/config -p wa -k selinux_config_delete_or_edit 
        ## Critical elements access failures
        -a always,exit -F arch=b64 -S open -F dir=/hostfs/etc -F success=0 -k unauthedfileaccess
        -a always,exit -F arch=b64 -S open -F dir=/hostfs/bin -F success=0 -k unauthedfileaccess
        -a always,exit -F arch=b64 -S open -F dir=/hostfs/sbin -F success=0 -k unauthedfileaccess
        -a always,exit -F arch=b64 -S open -F dir=/hostfs/usr/bin -F success=0 -k unauthedfileaccess
        -a always,exit -F arch=b64 -S open -F dir=/hostfs/usr/sbin -F success=0 -k unauthedfileaccess
        -a always,exit -F arch=b64 -S open -F dir=/hostfs/var -F success=0 -k unauthedfileaccess
        -a always,exit -F arch=b64 -S open -F dir=/hostfs/home -F success=0 -k unauthedfileaccess
        -a always,exit -F arch=b64 -S open -F dir=/hostfs/srv -F success=0 -k unauthedfileaccess
        ## Process ID change (switching accounts) applications
        -w /hostfs/usr/bin/su -p x -k priv_esc_exec
        -w /hostfs/bin/su -p x -k priv_esc_exec
        -w /hostfs/usr/sbin/su -p x -k priv_esc_exec
        -w /hostfs/usr/local/sbin/su -p x -k priv_esc_exec
        -w /hostfs/usr/local/bin/su -p x -k priv_esc_exec
        -w /hostfs/usr/bin/sudo -p x -k priv_esc_exec
        -w /hostfs/bin/sudo -p x -k priv_esc_exec
        -w /hostfs/usr/sbin/sudo -p x -k priv_esc_exec
        -w /hostfs/usr/local/sbin/sudo -p x -k priv_esc_exec
        -w /hostfs/usr/local/bin/sudo -p x -k priv_esc_exec
        ## Power state
        -w /hostfs/usr/bin/shutdown -p x -k power_exec
        -w /hostfs/bin/shutdown -p x -k power_exec
        -w /hostfs/usr/sbin/shutdown -p x -k power_exec
        -w /hostfs/usr/local/sbin/shutdown -p x -k power_exec
        -w /hostfs/usr/local/bin/shutdown -p x -k power_exec
        -w /hostfs/usr/bin/poweroff -p x -k power_exec
        -w /hostfs/bin/poweroff -p x -k power_exec
        -w /hostfs/usr/sbin/poweroff -p x -k power_exec
        -w /hostfs/usr/local/sbin/poweroff -p x -k power_exec
        -w /hostfs/usr/local/bin/poweroff -p x -k power_exec
        -w /hostfs/usr/bin/reboot -p x -k power_exec
        -w /hostfs/bin/reboot -p x -k power_exec
        -w /hostfs/usr/sbin/reboot -p x -k power_exec
        -w /hostfs/usr/local/sbin/reboot -p x -k power_exec
        -w /hostfs/usr/local/bin/reboot -p x -k power_exec
        -w /hostfs/usr/bin/halt -p x -k power_exec
        -w /hostfs/bin/halt -p x -k power_exec
        -w /hostfs/usr/sbin/halt -p x -k power_exec
        -w /hostfs/usr/local/sbin/halt -p x -k power_exec
        -w /hostfs/usr/local/bin/halt -p x -k power_exec
        ## Session initiation information
        -w /hostfs/var/run/utmp -p wa -k session
        -w /hostfs/var/log/btmp -p wa -k session
        -w /hostfs/var/log/wtmp -p wa -k session
        ## Discretionary Access Control (DAC) modifications
        -a always,exit -F arch=b64 -S chmod  -F auid>=1000 -F auid!=-1 -k perm_mod
        -a always,exit -F arch=b64 -S chown -F auid>=1000 -F auid!=-1 -k perm_mod
        -a always,exit -F arch=b64 -S fchmod -F auid>=1000 -F auid!=-1 -k perm_mod
        -a always,exit -F arch=b64 -S fchmodat -F auid>=1000 -F auid!=-1 -k perm_mod
        -a always,exit -F arch=b64 -S fchown -F auid>=1000 -F auid!=-1 -k perm_mod
        -a always,exit -F arch=b64 -S fchownat -F auid>=1000 -F auid!=-1 -k perm_mod
        -a always,exit -F arch=b64 -S fremovexattr -F auid>=1000 -F auid!=-1 -k perm_mod
        -a always,exit -F arch=b64 -S fsetxattr -F auid>=1000 -F auid!=-1 -k perm_mod
        -a always,exit -F arch=b64 -S lchown -F auid>=1000 -F auid!=-1 -k perm_mod
        -a always,exit -F arch=b64 -S lremovexattr -F auid>=1000 -F auid!=-1 -k perm_mod
        -a always,exit -F arch=b64 -S lsetxattr -F auid>=1000 -F auid!=-1 -k perm_mod
        -a always,exit -F arch=b64 -S removexattr -F auid>=1000 -F auid!=-1 -k perm_mod
        -a always,exit -F arch=b64 -S setxattr -F auid>=1000 -F auid!=-1 -k perm_mod
        # Special Rules ---------------------------------------------------------------
        ## Reconnaissance
        -w /hostfs/usr/bin/whoami -p x -k recon_exec
        -w /hostfs/bin/whoami -p x -k recon_exec
        -w /hostfs/usr/sbin/whoami -p x -k recon_exec
        -w /hostfs/usr/local/sbin/whoami -p x -k recon_exec
        -w /hostfs/usr/local/bin/whoami -p x -k recon_exec
        -w /hostfs/usr/bin/id -p x -k recon_exec
        -w /hostfs/bin/id -p x -k recon_exec
        -w /hostfs/usr/sbin/id -p x -k recon_exec
        -w /hostfs/usr/local/sbin/id -p x -k recon_exec
        -w /hostfs/usr/local/bin/id -p x -k recon_exec
        -w /hostfs/usr/bin/hostname -p x -k recon_exec
        -w /hostfs/bin/hostname -p x -k recon_exec
        -w /hostfs/usr/sbin/hostname -p x -k recon_exec
        -w /hostfs/usr/local/sbin/hostname -p x -k recon_exec
        -w /hostfs/usr/local/bin/hostname -p x -k recon_exec
        -w /hostfs/usr/bin/uname -p x -k recon_exec
        -w /hostfs/bin/uname -p x -k recon_exec
        -w /hostfs/usr/sbin/uname -p x -k recon_exec
        -w /hostfs/usr/local/sbin/uname -p x -k recon_exec
        -w /hostfs/usr/local/bin/uname -p x -k recon_exec
        -w /hostfs/etc/issue -p r -k recon
        -w /hostfs/etc/hostname -p r -k recon
        ## Suspicious activity
        -w /hostfs/usr/bin/wget -p x -k susp_activity_exec
        -w /hostfs/bin/wget -p x -k susp_activity_exec
        -w /hostfs/usr/sbin/wget -p x -k susp_activity_exec
        -w /hostfs/usr/local/sbin/wget -p x -k susp_activity_exec
        -w /hostfs/usr/local/bin/wget -p x -k susp_activity_exec
        -w /hostfs/usr/bin/curl -p x -k susp_activity_exec
        -w /hostfs/bin/curl -p x -k susp_activity_exec
        -w /hostfs/usr/sbin/curl -p x -k susp_activity_exec
        -w /hostfs/usr/local/sbin/curl -p x -k susp_activity_exec
        -w /hostfs/usr/local/bin/curl -p x -k susp_activity_exec
        -w /hostfs/usr/bin/base64 -p x -k susp_activity_exec
        -w /hostfs/bin/base64 -p x -k susp_activity_exec
        -w /hostfs/usr/sbin/base64 -p x -k susp_activity_exec
        -w /hostfs/usr/local/sbin/base64 -p x -k susp_activity_exec
        -w /hostfs/usr/local/bin/base64 -p x -k susp_activity_exec
        -w /hostfs/usr/bin/nc -p x -k susp_activity_exec
        -w /hostfs/bin/nc -p x -k susp_activity_exec
        -w /hostfs/usr/sbin/nc -p x -k susp_activity_exec
        -w /hostfs/usr/local/sbin/nc -p x -k susp_activity_exec
        -w /hostfs/usr/local/bin/nc -p x -k susp_activity_exec
        -w /hostfs/usr/bin/netcat -p x -k susp_activity_exec
        -w /hostfs/bin/netcat -p x -k susp_activity_exec
        -w /hostfs/usr/sbin/netcat -p x -k susp_activity_exec
        -w /hostfs/usr/local/sbin/netcat -p x -k susp_activity_exec
        -w /hostfs/usr/local/bin/netcat -p x -k susp_activity_exec
        -w /hostfs/usr/bin/ncat -p x -k susp_activity_exec
