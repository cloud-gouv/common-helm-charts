# =============================================================================
# Envoy Gateway Routes — Helm Chart Values
# Docs: https://gateway.envoyproxy.io/docs/
# Gateway API spec: https://gateway-api.sigs.k8s.io/
# =============================================================================

global:
  namespace: ""
  labels: {}
  annotations: {}

# =============================================================================
# GatewayClass
# Cluster-scoped resource — définit quel controller gère les Gateways.
# En général une seule GatewayClass par cluster (ou une par "profil" réseau).
# ⚠️  Ressource cluster-scoped : pas de namespace.
# =============================================================================
gatewayClasses: []
# - name: eg                          # nom par défaut Envoy Gateway
#   labels: {}
#   annotations: {}
#   description: "Default Envoy Gateway class"
#
#   # Controller qui prend en charge cette classe
#   # Valeur par défaut EG (ne pas changer sauf custom controller)
#   controllerName: gateway.envoyproxy.io/gatewayclass-controller
#
#   # Référence optionnelle vers une EnvoyProxy (configuration avancée du proxy)
#   # Permet de personnaliser : provider, logging, telemetry, bootstrap, etc.
#   parametersRef:
#     group: gateway.envoyproxy.io
#     kind: EnvoyProxy
#     name: my-envoy-proxy-config
#     namespace: envoy-gateway-system
#
# # Exemple : deux classes pour séparer trafic public / interne
# - name: public-gateway
#   description: "Internet-facing gateway"
#   controllerName: gateway.envoyproxy.io/gatewayclass-controller
#   parametersRef:
#     group: gateway.envoyproxy.io
#     kind: EnvoyProxy
#     name: public-envoy-proxy
#     namespace: envoy-gateway-system
#
# - name: private-gateway
#   description: "Internal/admin gateway"
#   controllerName: gateway.envoyproxy.io/gatewayclass-controller
#   parametersRef:
#     group: gateway.envoyproxy.io
#     kind: EnvoyProxy
#     name: private-envoy-proxy
#     namespace: envoy-gateway-system

# =============================================================================
# Gateway
# Entry point: defines listeners (HTTP, HTTPS, TCP, TLS, UDP)
# =============================================================================
gateways: []
