# =============================================================================
# Exemple : EnvoyProxy "platform" (public + interne)
# Équivalent Helm de la config raw Jinja utilisée sur les clusters :
#   - DaemonSet Envoy + module dynamique coraza/composer
#   - LB Outscale (proxy-protocol, multi-AZ, external-dns)
#   - patch StrategicMerge sur le Service (externalTrafficPolicy, cilium l2)
#   - gateway interne avec loadBalancerSourceRanges
#
# Usage:
#   helm install platform-gateway ./envoy-gateway-infra \
#     -n envoy-gateway-system -f examples/envoyproxy-platform.yaml
# =============================================================================

envoyProxies:
  # ── Proxy public ─────────────────────────────────────────────────────────
  - name: platform-gateway-proxy
    namespace: envoy-gateway-system
    provider:
      type: Kubernetes
      kubernetes:
        envoyDaemonSet:
          # Bloc coraza — si la feature n'est pas activée, mettre `{}`
          pod:
            volumes:
              - name: dynamic-modules
                image:
                  reference: ghcr.io/tetratelabs/built-on-envoy/composer:1.0.0
                  pullPolicy: IfNotPresent
          container:
            env:
              - name: GODEBUG
                value: "cgocheck=0"
            volumeMounts:
              - name: dynamic-modules
                mountPath: /etc/envoy/dynamic-modules
                readOnly: true
        envoyService:
          annotations:
            service.beta.kubernetes.io/osc-load-balancer-name: "eg-ab12cd34-app-a,eg-ab12cd34-app-b,eg-ab12cd34-app-c"
            service.beta.kubernetes.io/osc-load-balancer-instances: "3"
            service.beta.kubernetes.io/osc-load-balancer-subregions: "eu-west-2a,eu-west-2b,eu-west-2c"
            service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
            service.beta.kubernetes.io/osc-load-balancer-ingress-address: "ip"
            external-dns.alpha.kubernetes.io/hostname: public1-gw.example.com
          patch:
            type: StrategicMerge
            value:
              spec:
                externalTrafficPolicy: Cluster
    dynamicModules:
      - name: composer
        source:
          type: Local
          local:
            path: /etc/envoy/dynamic-modules/libcomposer.so
        doNotClose: true
        loadGlobally: false

  # ── Proxy interne ────────────────────────────────────────────────────────
  - name: platform-private-gateway-proxy
    namespace: envoy-gateway-system
    provider:
      type: Kubernetes
      kubernetes:
        envoyDaemonSet: {}
        envoyService:
          annotations:
            service.beta.kubernetes.io/osc-load-balancer-name: "eg-ab12cd34-internal-app"
            service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
            service.beta.kubernetes.io/osc-load-balancer-ingress-address: "ip"
            service.beta.kubernetes.io/osc-load-balancer-internal: "true"
            external-dns.alpha.kubernetes.io/hostname: private1-gw.example.com
          patch:
            type: StrategicMerge
            value:
              spec:
                externalTrafficPolicy: Local
                loadBalancerClass: io.cilium/l2-announcer
                loadBalancerSourceRanges:
                  - 10.0.0.0/8
                  - 192.168.0.0/16

# Rattachement à une GatewayClass
gatewayClasses:
  - name: eg
    description: "Public platform gateway"
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: platform-gateway-proxy
      namespace: envoy-gateway-system
