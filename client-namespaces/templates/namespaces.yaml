{{/*
    this template aims at generating all the required namespaces for the 'clients'
*/}}

{{- range $clientNamespaceName, $_ := .Values.clientNamespaces }}
  {{/* let's not process system namespaces */}}
  {{- if not (or (hasPrefix "kube-" $clientNamespaceName) (eq $clientNamespaceName "default")) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $clientNamespaceName }}
  labels:
    {{- include "client-namespaces.labels" $ | nindent 4 }}
    {{- with (index (index $.Values.clientNamespaces $clientNamespaceName) "labels") }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- $nodePool := index (index $.Values.clientNamespaces $clientNamespaceName) "nodePool" }}
  {{- $annotations := index (index $.Values.clientNamespaces $clientNamespaceName) "annotations" }}
  {{- if or $nodePool $annotations }}
  annotations:
    {{- with $nodePool }}
    # enforced by the PodNodeSelector admission plugin
    scheduler.alpha.kubernetes.io/node-selector: node-restriction.kubernetes.io/node-pool={{ . }}
    {{- end }}
    {{- with $annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
