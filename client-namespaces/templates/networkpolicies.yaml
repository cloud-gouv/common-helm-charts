{{/*
    this template aims at generating the CiliumNetworkPolicy for each 'client'
    namespace: default-deny with explicit allows, protected from tenants
*/}}


{{- range $clientNamespaceName, $clientNs := .Values.clientNamespaces }}
  {{/* let's not process system namespaces */}}
  {{- if not (or (hasPrefix "kube-" $clientNamespaceName) (eq $clientNamespaceName "default")) }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-netpol-{{ $clientNamespaceName }}
  namespace: {{ $clientNamespaceName }}
  labels:
    netpol.opi/protected: "true"
spec:
  endpointSelector: {}
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.cilium.k8s.namespace.labels.access-to-all: "true"
    - matchLabels:
        k8s:io.cilium.k8s.namespace.labels.access-to-{{ $clientNamespaceName }}: "true"
    - matchLabels:
        k8s:io.cilium.k8s.namespace.labels.to-{{ $clientNamespaceName }}: "true"
  # multi-pod apps in the same namespace must reach each other
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: "{{ $clientNamespaceName }}"
  egress:
  # traffic inside the client namespace (app <-> postgres, minio, ...)
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: "{{ $clientNamespaceName }}"
  # DNS
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
{{- if eq (index (index $clientNs "labels" | default dict) "access-to-apiserver" | default "false") "true" }}
  # temporary: to be removed once France-Transfert redis backup / Tchap / Grist no longer need the api-server
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
      - port: "6443"
        protocol: TCP
{{- end }}
  # dedicated services for this client (ns labeled to-<client>)
  - toEndpoints:
    - matchLabels:
        k8s:io.cilium.k8s.namespace.labels.to-{{ $clientNamespaceName }}: "true"
  # external traffic (toCIDR only matches non-endpoint destinations, cluster-internal stays denied)
  - toCIDR:
    - 0.0.0.0/0
  {{- end }}
{{- end }}
