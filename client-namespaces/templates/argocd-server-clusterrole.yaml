{{- if .Values.argocd.rbacEnabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-server-namespace
  labels:
    {{- include "client-namespaces.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs:
      - delete
      - get
      - patch
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
{{- end }}
