{{/*
    Bind the ArgoCD server to 'argocd-server-namespace' in each client namespace
*/}}
{{- if .Values.argocd.rbacEnabled }}
{{- range $clientNamespaceName, $_ := .Values.clientNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-server-namespace
  namespace: {{ $clientNamespaceName }}
  labels:
    {{- include "client-namespaces.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.argocd.serverServiceAccount }}
    namespace: {{ $.Values.argocd.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-server-namespace
{{- end }}
{{- end }}
