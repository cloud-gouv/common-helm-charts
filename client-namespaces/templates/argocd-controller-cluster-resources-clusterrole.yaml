{{- if .Values.argocd.rbacEnabled }}
{{- range $clientNamespaceName, $clientNamespaceValue := .Values.clientNamespaces }}
{{- if $clientNamespaceValue.clusterResources }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-controller-cluster-resources-{{ $clientNamespaceName }}
  labels:
    {{- include "client-namespaces.labels" $ | nindent 4 }}
rules:
  {{- range $clientNamespaceValue.clusterResources }}
  - apiGroups: ["{{ .group }}"]
    resources: ["{{ .resource | default (printf "%ss" (lower .kind)) }}"]
    verbs: ["*"]
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
