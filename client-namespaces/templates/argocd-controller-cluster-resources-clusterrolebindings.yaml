{{- if .Values.argocd.rbacEnabled }}
{{- range $clientNamespaceName, $clientNamespaceValue := .Values.clientNamespaces }}
{{- if $clientNamespaceValue.clusterResources }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-controller-cluster-resources-{{ $clientNamespaceName }}
  labels:
    {{- include "client-namespaces.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.argocd.controllerServiceAccount }}
    namespace: {{ $.Values.argocd.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-controller-cluster-resources-{{ $clientNamespaceName }}
{{- end }}
{{- end }}
{{- end }}
