# Default values for autofix.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  registry: ghcr.io/cloud-gouv
  repository: autofix
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  # TODO
  tag: v0.5.0

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  # If set and create is false, the existing ServiceAccount is used
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  runAsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault
  readOnlyRootFilesystem: true

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 16Mi

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# separate option for tmp dir so it doesn't need to be copied over when volumes are added
tmpDir:
  create: true
  mountSpec:
    mountPath: /tmp
  volumeSpec:
    emptyDir: {}

nodeSelector: {}

tolerations: []

affinity: {}

# This section builds out the role
rbac:
  # Specifies whether a Role should be created
  create: true
  role:
    rules:
    - apiGroups: [""]
      resources: [pods]
      verbs: [get]

# https://argo-cd.readthedocs.io/en/release-3.1/user-guide/sync-waves/#sync-phases-and-waves
hook: PreSync
# https://argo-cd.readthedocs.io/en/release-3.1/user-guide/sync-waves/#hook-lifecycle-and-cleanup
hookDeletePolicy: HookSucceeded,BeforeHookCreation
# https://argo-cd.readthedocs.io/en/release-3.1/user-guide/sync-waves/#how-do-i-configure-waves
hookSyncWave: null

# /bin/bash or /usr/bin/python, or whatever is available in a custom image
# python can `import kubernetes` to work with kube api
command:
  - /bin/bash
  - -c
args:
  - |
    set -euo pipefail
    echo {{ .Values.image.tag }}
    kubectl get pod
scriptTemplate: null

# environment variables added to job's pod
env: []
envFrom: []
envTemplate: []

# extra files to mount using a ConfigMap
extraFiles: {}
extraFilesTemplate: {}
extraFilesMountPath: /home/autofix/extra
