{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "autofix.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "autofix.labels" . | nindent 4 }}
  annotations:
    {{- include "autofix.hookAnnotations" . | nindent 4 }}
{{- with .Values.rbac.role.rules }}
rules:
{{ toYaml . }}
{{- end }}
{{- end }}
