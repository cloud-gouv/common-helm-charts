{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "autofix.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "autofix.labels" . | nindent 4 }}
  annotations:
    {{- include "autofix.hookAnnotations" . | nindent 4 }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
