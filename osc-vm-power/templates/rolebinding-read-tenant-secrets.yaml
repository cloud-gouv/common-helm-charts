{{- if .Values.osc.perTenantCredentials }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "osc-vm-power.fullname" . }}-read-tenant-secrets
  namespace: {{ .Values.osc.clustersNamespace }}
  labels:
    {{- include "osc-vm-power.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "osc-vm-power.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "osc-vm-power.fullname" . }}-read-tenant-secrets
  apiGroup: rbac.authorization.k8s.io
{{- end }}
