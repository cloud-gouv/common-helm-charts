{{- if .Values.imagePullSecret.create }}
{{- /* Même garde-fou que pour les credentials OSC : sans lui, le PAT partirait
       chiffré et l'échec n'apparaîtrait qu'en ImagePullBackOff au CronJob suivant. */}}
{{- if hasPrefix "ENC[" (.Values.imagePullSecret.password | toString) }}
{{- fail "valeurs SOPS non déchiffrées : utiliser `sops -d secrets/osc.enc.yaml | helm upgrade ... -f -` ou `helm secrets upgrade`, pas `helm -f secrets/osc.enc.yaml`" }}
{{- end }}
{{- $registry := .Values.imagePullSecret.registry }}
{{- $username := required "imagePullSecret.username est vide : passer -f secrets/osc.enc.yaml (SOPS), ou imagePullSecret.create=false pour réutiliser un Secret existant" .Values.imagePullSecret.username }}
{{- $password := required "imagePullSecret.password est vide (PAT GitHub, scope read:packages) : passer -f secrets/osc.enc.yaml (SOPS), ou imagePullSecret.create=false pour réutiliser un Secret existant" .Values.imagePullSecret.password }}
{{- $auth := printf "%s:%s" $username $password | b64enc }}
{{- $config := dict "auths" (dict $registry (dict "username" $username "password" $password "auth" $auth)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "osc-vm-power.imagePullSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osc-vm-power.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $config | toJson | b64enc }}
{{- end }}
