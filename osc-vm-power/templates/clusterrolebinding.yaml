apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "osc-vm-power.fullname" . }}-read-machines
  labels:
    {{- include "osc-vm-power.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "osc-vm-power.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "osc-vm-power.fullname" . }}-read-machines
  apiGroup: rbac.authorization.k8s.io
