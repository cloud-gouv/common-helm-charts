{{- if .Values.secret.create }}
{{- /* Valeurs SOPS non déchiffrées : sans ce garde-fou le Secret part avec le
       ciphertext ENC[...] et l'échec n'apparaît qu'au CronJob suivant, en 401. */}}
{{- range list .Values.secret.accessKey .Values.secret.secretKey }}
{{- if hasPrefix "ENC[" (. | toString) }}
{{- fail "valeurs SOPS non déchiffrées : utiliser `sops -d secrets/osc.enc.yaml | helm upgrade ... -f -` ou `helm secrets upgrade`, pas `helm -f secrets/osc.enc.yaml`" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osc-vm-power.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secret.accessKeyKey }}: {{ required "secret.accessKey est vide : passer -f secrets/osc.enc.yaml (SOPS), ou secret.create=false pour réutiliser un Secret existant" .Values.secret.accessKey | quote }}
  {{ .Values.secret.secretKeyKey }}: {{ required "secret.secretKey est vide : passer -f secrets/osc.enc.yaml (SOPS), ou secret.create=false pour réutiliser un Secret existant" .Values.secret.secretKey | quote }}
{{- end }}
