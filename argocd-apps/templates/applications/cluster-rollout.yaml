{{- /*
Progressive rollout of cluster-core / cluster-workload, split into smaller
apps synced in dependency order via an ApplicationSet RollingSync strategy,
instead of the monolithic cluster-core / cluster-workload apps.

Requires Progressive Syncs enabled on the applicationset-controller:
  configs.params."applicationsetcontroller.enable.progressive.syncs" = "true"
(argocd-cmd-params-cm), otherwise the strategy is ignored and Applications
sync as soon as they're created.

RollingSync also requires syncPolicy.automated on the generated Applications:
the controller only annotates them to trigger a sync, it never syncs them
itself. Without `automated`, apps stay Pending forever and the controller
re-reconciles in a hot loop (watch -> status write -> watch), which will OOM
the applicationset-controller.

Recognized apps (all optional, enable any subset):
  cluster-core-foundation        - core + workload namespaces, cert-manager, external-secrets
  cluster-core-network           - ingress, envoy-gateway, external-dns
  cluster-workload-foundation    - client namespaces, cnpg/minio operators, trust-manager, sops, openbao
  cluster-workload-platform      - argocd, argocd-apps, autoscalers, metrics-server, clusterctl backup/restore
  cluster-workload-observability - prometheus, loki, alloy, auditbeat, matrix-receiver
  cluster-workload-tenants       - minio, whoami, per-client resources
*/}}
{{- $repoURL := .Values.source.repoURL }}
{{- /*
`prefix` only shapes the generated Application name, so the ArgoCD list sorts in
rollout order instead of alphabetically. Apps sharing a rollout step share it.
It is not the `apps:` key in values - those stay unprefixed.
*/}}
{{- $components := list
  (dict "app" "cluster-core-foundation"        "prefix" "step-01" "step" "step-01-core-foundation"                 "helmfileFile" "helmfile.d/cluster-step-02-configure-core-foundation"              "compareOptions" "")
  (dict "app" "cluster-core-network"           "prefix" "step-02" "step" "step-02-core-network"                    "helmfileFile" "helmfile.d/cluster-step-02-configure-core-network"                 "compareOptions" "")
  (dict "app" "cluster-workload-foundation"    "prefix" "step-03" "step" "step-03-workload-foundation"             "helmfileFile" "helmfile.d/cluster-step-03-configure-workload-foundation"          "compareOptions" "")
  (dict "app" "cluster-workload-platform"      "prefix" "step-04" "step" "step-04-workload-platform-observability" "helmfileFile" "helmfile.d/cluster-step-03-configure-workload-platform"            "compareOptions" "ServerSideDiff=true,IncludeMutationWebhook=true")
  (dict "app" "cluster-workload-observability" "prefix" "step-04" "step" "step-04-workload-platform-observability" "helmfileFile" "helmfile.d/cluster-step-03-configure-workload-observability"       "compareOptions" "")
  (dict "app" "cluster-workload-tenants"       "prefix" "step-05" "step" "step-05-workload-tenants"                "helmfileFile" "helmfile.d/cluster-step-03-configure-workload-tenants"             "compareOptions" "")
}}
{{- range $appName, $appData := .Values.applications }}
{{- if hasKey $appData "apps" }}
{{- $enabledComponents := list }}
{{- range $c := $components }}
{{- if hasKey $appData.apps $c.app }}
{{- $data := index $appData.apps $c.app }}
{{- $enabled := (or (empty $data) (or (not (hasKey $data "enabled")) (eq $data.enabled true))) }}
{{- if $enabled }}
{{- $enabledComponents = append $enabledComponents $c }}
{{- end }}
{{- end }}
{{- end }}
{{- if gt (len $enabledComponents) 0 }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-rollout-{{ $appName }}
  namespace: {{ $.Values.namespace }}
  annotations:
    # created after cluster-api (sync-wave "1") is healthy; ordering of the
    # generated apps themselves is then handled by strategy.rollingSync below
    argocd.argoproj.io/sync-wave: "2"
spec:
  goTemplate: true
  generators:
    - list:
        elements:
        {{- range $c := $enabledComponents }}
          - app: {{ $c.app }}
            prefix: {{ $c.prefix }}
            step: {{ $c.step }}
            helmfileFile: {{ $c.helmfileFile }}
            compareOptions: {{ $c.compareOptions | quote }}
        {{- end }}
  template:
    metadata:
      name: '{{`{{.prefix}}`}}-{{`{{.app}}`}}-{{ $appName }}'
      namespace: {{ $.Values.namespace }}
      labels:
        rollout-step: '{{`{{.step}}`}}'
      annotations:
        # empty on apps that don't need it (e.g. cluster-workload-platform
        # runs argocd/argocd-apps/metrics-server/autoscalers, mutated by
        # admission webhooks incl. argocd's own when the mgmt cluster
        # manages itself, causing perpetual OutOfSync diffs otherwise)
        argocd.argoproj.io/compare-options: '{{`{{.compareOptions}}`}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      destination:
        namespace: default
        # here is the name of the target cluster
        name: {{ $appName | quote }}
      source:
        repoURL: {{ $repoURL }}
        targetRevision: {{ template "argocd-apps.defaultSourceTargetRevision" $ }}
        path: {{ default (include "argocd-apps.defaultSourcePath" $) $appData.path }}
        plugin:
          name: helmfile-v1.0
          env:
            - name: ENV_NAME
              value: {{ default $appName $appData.helmfile_env }}
            - name: HELMFILE_FILE
              value: '{{`{{.helmfileFile}}`}}'
            - name: HELMFILE_MULTI_NAMESPACE
              value: "true"
      syncPolicy:
        # required by RollingSync: the applicationset-controller only triggers
        # syncs, it doesn't perform them
        automated:
          prune: true
          selfHeal: true
          # never prune everything when the CMP returns no manifests (e.g. a
          # bad HELMFILE_FILE path) - an empty desired state would otherwise
          # wipe namespaces/CRDs managed by the step-01 app
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            maxDuration: 3m0s
            factor: 2
      # applies to all generated apps; harmless no-op on apps where the
      # referenced resource doesn't exist
      ignoreDifferences:
        - group: ""
          kind: Secret
          name: argocd-secret
          namespace: argocd
          jsonPointers:
            - /metadata/annotations/argocd.argoproj.io~1tracking-id
        - kind: ConfigMap
          name: prometheus-adapter-client
          jsonPointers:
            - /data/config.yaml
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: rollout-step
              operator: In
              values: ["step-01-core-foundation"]
        - matchExpressions:
            - key: rollout-step
              operator: In
              values: ["step-02-core-network"]
        - matchExpressions:
            - key: rollout-step
              operator: In
              values: ["step-03-workload-foundation"]
        - matchExpressions:
            - key: rollout-step
              operator: In
              values: ["step-04-workload-platform-observability"]
        - matchExpressions:
            - key: rollout-step
              operator: In
              values: ["step-05-workload-tenants"]
{{- end }}
{{- end }}
{{- end }}
