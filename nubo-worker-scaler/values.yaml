image:
  repository: <REGISTRY>/nubo-worker-scaler
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
#  - name: ghcr-creds

fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

# Seules les MachineDeployment sont listées et patchées
scaler:
  # Sous-chaînes du nom de cluster (label cluster.x-k8s.io/cluster-name) à traiter.
  # Liste vide = tous les clusters, sous réserve des exclusions ci-dessous.
  includedClusterSubstrings:
    - "-wapp-"
  # Sous-chaînes exclues, appliquées après les inclusions. Le cluster de management
  # héberge ce CronJob : le laisser exclu évite qu'il se coupe ses propres workers.
  excludedClusterSubstrings:
    - mgmt
  # Version de l'API cluster.x-k8s.io à utiliser. Vide = version préférée annoncée par
  # le cluster (v1beta1 avant CAPI 1.11, v1beta2 ensuite).
  apiVersion: ""
  # Replicas appliqués au scale-up quand l'annotation de sauvegarde manque.
  # 0 désactive ce repli : une MachineDeployment à 0 non éteinte par cet outil reste à 0.
  fallbackReplicas: 1
  # Attente de convergence : suppression effective des Machines au down, Machines Ready au up.
  pollIntervalSeconds: 15
  pollTimeoutSeconds: 900
  # true : le Job sort dès les patchs appliqués, sans attendre les Machines.
  noWait: false

schedule:
  timeZone: "Europe/Paris"
  down: "0 20 * * 1-5"
  up: "0 8 * * 1-5"

# Si false, le CronJob correspondant est suspendu.
# downEnabled: false gèle le scale-down ; upEnabled: false laisse les workers éteints.
downEnabled: true
upEnabled: true

# Si true, les Jobs rejouent leurs patchs avec dryRun=All : RBAC et admission sont
# exercés, aucune MachineDeployment n'est modifiée.
dryRun: false

concurrencyPolicy: Forbid
backoffLimit: 2
# Filet de sécurité : au-delà, le Job passe en Failed plutôt que de rester bloqué.
# Garder une marge sur scaler.pollTimeoutSeconds.
activeDeadlineSeconds: 1200
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
