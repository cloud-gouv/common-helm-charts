{{- if and (eq .Values.provider "outscale") .Values.outscale.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.outscale.secret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vm-power.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.outscale.secret.accessKeyKey }}: {{ required "outscale.secret.accessKey est vide : passer -f secrets/osc.enc.yaml (SOPS), ou outscale.secret.create=false pour réutiliser un Secret existant" .Values.outscale.secret.accessKey | quote }}
  {{ .Values.outscale.secret.secretKeyKey }}: {{ required "outscale.secret.secretKey est vide : passer -f secrets/osc.enc.yaml (SOPS), ou outscale.secret.create=false pour réutiliser un Secret existant" .Values.outscale.secret.secretKey | quote }}
{{- end }}
