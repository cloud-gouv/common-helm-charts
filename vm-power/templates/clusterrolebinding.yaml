apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vm-power.fullname" . }}
  labels:
    {{- include "vm-power.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "vm-power.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "vm-power.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
