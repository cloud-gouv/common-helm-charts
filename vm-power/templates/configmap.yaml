apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vm-power.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vm-power.labels" . | nindent 4 }}
data:
  PROVIDER: {{ .Values.provider | quote }}
  CAPI_API_VERSION: {{ .Values.capi.apiVersion | quote }}
  CLUSTER_NAME: {{ required "capi.clusterName est obligatoire : nom du cluster workload à arrêter/démarrer" .Values.capi.clusterName | quote }}
  DRY_RUN: {{ .Values.dryRun | quote }}
  NO_WAIT: {{ not .Values.wait.enabled | quote }}
  POLL_INTERVAL_SECONDS: {{ .Values.wait.pollIntervalSeconds | quote }}
  POLL_TIMEOUT_SECONDS: {{ .Values.wait.timeoutSeconds | quote }}
  {{- if eq .Values.provider "outscale" }}
  OSC_REGION: {{ .Values.outscale.region | quote }}
  {{- end }}
  {{- if eq .Values.provider "nubo" }}
  FALLBACK_REPLICAS: {{ .Values.nubo.fallbackReplicas | quote }}
  SKIP_NODE_DRAIN: {{ .Values.nubo.skipNodeDrain | quote }}
  {{- end }}
