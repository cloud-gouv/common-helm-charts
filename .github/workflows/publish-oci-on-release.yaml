name: Publish Helm charts to GHCR (OCI)

on:
  push:
    branches: [main]
    paths:
      - '**/Chart.yaml'

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      charts: ${{ steps.detect.outputs.charts }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Login to GHCR
        run: echo "${{ github.token }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Detect charts with a new version
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          namespace="${GITHUB_REPOSITORY_OWNER,,}"
          charts_json="[]"

          for chart_yaml in */Chart.yaml; do
            dir="$(dirname "$chart_yaml")"
            name="$(yq '.name' "$chart_yaml")"
            version="$(yq '.version' "$chart_yaml")"
            version="${version#v}"

            if [[ -z "$version" || "$version" == "null" ]]; then
              echo "::warning::$chart_yaml has no version, skipping"
              continue
            fi

            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "::warning::$name version '$version' is not valid SemVer, skipping"
              continue
            fi

            if helm show chart "oci://ghcr.io/$namespace/helm/$name" --version "$version" >/dev/null 2>&1; then
              echo "$name@$version already published, skipping"
              continue
            fi

            echo "$name@$version is new, queuing for publish"
            charts_json=$(jq -c --arg dir "$dir" --arg name "$name" --arg version "$version" \
              '. + [{"dir": $dir, "name": $name, "version": $version}]' <<<"$charts_json")
          done

          echo "charts=$charts_json" >> "$GITHUB_OUTPUT"
  publish:
    needs: detect
    if: needs.detect.outputs.charts != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        chart: ${{ fromJson(needs.detect.outputs.charts) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Login to GHCR
        run: echo "${{ github.token }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and push chart
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package "${{ matrix.chart.dir }}" \
            --version "${{ matrix.chart.version }}" \
            -d dist
          helm push "dist/${{ matrix.chart.name }}-${{ matrix.chart.version }}.tgz" \
            "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/helm"
